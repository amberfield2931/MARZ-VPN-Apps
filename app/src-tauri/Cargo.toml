[package]
name = "marzvpn"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["os-keyring"]
os-keyring = ["marz-core/os-keyring"]
# Test builds only, see crates/marz-core/Cargo.toml.
lab = ["marz-core/lab"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
marz-core = { path = "../../crates/marz-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
