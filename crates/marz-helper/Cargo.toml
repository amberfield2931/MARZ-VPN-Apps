[package]
name = "marz-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "marzvpn-helper"
path = "src/main.rs"

[dependencies]
marz-engine = { path = "../marz-engine" }
serde.workspace = true
serde_json.workspace = true
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Rpc", "Win32_System_Threading"] }
